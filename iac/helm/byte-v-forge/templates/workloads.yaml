{{- range $component, $workload := .Values.workloads }}
{{- if $workload.enabled }}
{{- $gptPrivateEnabled := true }}
{{- with $.Values.gptPrivate }}
{{- if hasKey . "enabled" }}
{{- $gptPrivateEnabled = .enabled }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "byte-v-forge.componentFullname" (dict "root" $ "component" $component) }}
  labels:
    {{- include "byte-v-forge.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ default 1 $workload.replicas }}
  {{- if $workload.strategyType }}
  strategy:
    type: {{ $workload.strategyType }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "byte-v-forge.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "byte-v-forge.selectorLabels" (dict "root" $ "component" $component) | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $podAnnotations := merge (dict) (default (dict) $.Values.podAnnotations) (default (dict) $workload.podAnnotations) }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "byte-v-forge.serviceAccountName" $ }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if hasKey $workload "hostNetwork" }}
      hostNetwork: {{ $workload.hostNetwork }}
      {{- end }}
      {{- with $workload.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- $cloudflareTunnelSidecar := and (eq $component "mailbox") $.Values.cloudflareTunnel.enabled }}
      containers:
        - name: {{ $component }}
          image: {{ include "byte-v-forge.image" (dict "root" $ "image" $workload.image) | quote }}
          imagePullPolicy: {{ default $.Values.global.imagePullPolicy $workload.imagePullPolicy }}
          {{- with $workload.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.ports }}
          ports:
            {{- range . }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ default "TCP" .protocol }}
            {{- end }}
            {{- range $range := $workload.portRanges }}
            {{- range untilStep (int $range.containerPortStart) (int (add1 $range.containerPortEnd)) 1 }}
            - name: {{ printf "%s-%d" $range.namePrefix . | quote }}
              containerPort: {{ . }}
              protocol: {{ default "TCP" $range.protocol }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if or $workload.postgresEnv $workload.env $workload.secretEnv }}
          env:
            {{- if $workload.postgresEnv }}
            - name: POSTGRES_USER
              value: {{ $.Values.postgres.auth.user | quote }}
            - name: POSTGRES_DB
              value: {{ $.Values.postgres.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "byte-v-forge.appSecretName" $ }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- range $name, $value := $workload.env }}
            - name: {{ $name }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- range $item := $workload.secretEnv }}
            - name: {{ $item.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "byte-v-forge.appSecretName" $ }}
                  key: {{ default $item.name $item.key }}
            {{- end }}
          {{- end }}
          {{- with $workload.volumeMounts }}
          volumeMounts:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with $workload.probes }}
          readinessProbe:
            {{- if .httpGet }}
            httpGet:
              path: {{ .httpGet.path | quote }}
              port: {{ .httpGet.port }}
            {{- else if .tcpSocketPort }}
            tcpSocket:
              port: {{ .tcpSocketPort }}
            {{- else if .grpc }}
            grpc:
              port: {{ .grpc.port }}
              {{- with .grpc.service }}
              service: {{ . | quote }}
              {{- end }}
            {{- else if .exec }}
            exec:
              command:
                {{- toYaml .exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ default 5 .initialDelaySeconds }}
            periodSeconds: {{ default 10 .periodSeconds }}
          livenessProbe:
            {{- if .httpGet }}
            httpGet:
              path: {{ .httpGet.path | quote }}
              port: {{ .httpGet.port }}
            {{- else if .tcpSocketPort }}
            tcpSocket:
              port: {{ .tcpSocketPort }}
            {{- else if .grpc }}
            grpc:
              port: {{ .grpc.port }}
              {{- with .grpc.service }}
              service: {{ . | quote }}
              {{- end }}
            {{- else if .exec }}
            exec:
              command:
                {{- toYaml .exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ default 20 .livenessInitialDelaySeconds }}
            periodSeconds: {{ default 20 .livenessPeriodSeconds }}
          {{- end }}
          resources:
            {{- toYaml $workload.resources | nindent 12 }}
        {{- if not (and (eq $component "gpt-service") (not $gptPrivateEnabled)) }}
        {{- with $workload.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if $cloudflareTunnelSidecar }}
        - name: cloudflare-tunnel
          image: {{ include "byte-v-forge.image" (dict "root" $ "image" $.Values.cloudflareTunnel.image) | quote }}
          imagePullPolicy: {{ default $.Values.global.imagePullPolicy $.Values.cloudflareTunnel.imagePullPolicy }}
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:{{ default 2000 $.Values.cloudflareTunnel.metricsPort }}
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "byte-v-forge.appSecretName" $ }}
                  key: CLOUDFLARE_TUNNEL_TOKEN
          ports:
            - name: cf-metrics
              containerPort: {{ default 2000 $.Values.cloudflareTunnel.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: cf-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: cf-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.cloudflareTunnel.resources | nindent 12 }}
        {{- end }}
      {{- with $workload.volumes }}
      volumes:
        {{- range . }}
        - name: {{ .name }}
          {{- if eq .type "emptyDir" }}
          emptyDir:
            {{- if .medium }}
            medium: {{ .medium | quote }}
            {{- end }}
            {{- if .sizeLimit }}
            sizeLimit: {{ .sizeLimit | quote }}
            {{- end }}
          {{- else if eq .type "secret" }}
          secret:
            secretName: {{ tpl .secretName $ }}
            {{- with .items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- else if eq .type "configMap" }}
          configMap:
            name: {{ tpl .configMapName $ }}
            {{- with .items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- else if eq .type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ tpl .claimName $ }}
          {{- end }}
        {{- end }}
      {{- end }}
{{- if and $workload.service $workload.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "byte-v-forge.componentFullname" (dict "root" $ "component" $component) }}
  labels:
    {{- include "byte-v-forge.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  type: {{ default "ClusterIP" $workload.service.type }}
  ports:
    {{- range $workload.service.ports }}
    {{- if not (and (eq $component "gpt-service") (not $gptPrivateEnabled) (eq .name "payment-grpc")) }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ default "TCP" .protocol }}
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- range $range := $workload.service.portRanges }}
    {{- range untilStep (int $range.portStart) (int (add1 $range.portEnd)) 1 }}
    - name: {{ printf "%s-%d" $range.namePrefix . | quote }}
      port: {{ . }}
      targetPort: {{ printf "%s-%d" $range.namePrefix . | quote }}
      protocol: {{ default "TCP" $range.protocol }}
    {{- end }}
    {{- end }}
  selector:
    {{- include "byte-v-forge.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}

{{- $bridge := .Values.openaiSsoLite.cloudflareTunnelBridge -}}
{{- if $bridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $bridge.serviceName }}
  namespace: {{ $bridge.namespace }}
  labels:
    {{- include "byte-v-forge.componentLabels" (dict "root" . "component" "openai-sso-lite-cloudflare-bridge") | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ tpl $bridge.externalName . }}
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
{{- end }}

global:
  imageRegistry: registry.example.internal/byte-v-forge
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

configEnv:
  PLATFORM_NATS_URL: 'nats://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "platform-nats") }}:4222'
  PLATFORM_EVENT_STREAM_NAME: BYTE_V_FORGE_EVENTS
  PLATFORM_REDIS_URL: 'redis://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "platform-redis") }}:6379/0'
  N8N_PUBLIC_URL: http://n8n.byte-v-forge.example.internal
  GPT_N8N_WEBHOOK_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-webhook") }}:5678/webhook'
  GOPAY_N8N_WEBHOOK_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-webhook") }}:5678/webhook'
  GPT_ACTION_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "gpt-service") }}:8080/api/gpt/actions'
  GOPAY_HTTP_LISTEN_ADDR: ":8080"
  GOPAY_DASHBOARD_STATIC_DIR: /app/dashboard/gopay
  GOPAY_ACTION_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "gopay-app") }}:8080/api/gopay/actions'
  GOPAY_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "gopay-app") }}:8080/api/gopay'
  WA_ACTION_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "wa-app-service") }}:8080/api/wa/actions'
  WA_APP_DATA_DIR: /var/lib/wa-app
  WA_APP_PG_DSN: '{{ include "byte-v-forge.pgDsn" . }}'
  WA_APP_REDIS_URL: '{{ tpl .Values.configEnv.PLATFORM_REDIS_URL . }}'
  WA_APP_PROXY_RUNTIME_API_BASE_URL: '{{ tpl .Values.configEnv.PROXY_RUNTIME_API_BASE_URL . }}'
  WA_APP_PROXY_RUNTIME_LOCAL_PROTOCOL: socks5
  WA_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "wa-app-service") }}:8080/api/wa'
  SMS_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "sms-service") }}:8080/api/sms'
  SMS_PG_DSN: '{{ include "byte-v-forge.pgDsn" . }}'
  SMS_REDIS_URL: '{{ tpl .Values.configEnv.PLATFORM_REDIS_URL . }}'
  SMS_NATS_URL: '{{ tpl .Values.configEnv.PLATFORM_NATS_URL . }}'
  SMS_EVENT_STREAM_NAME: BYTE_V_FORGE_EVENTS
  PROXY_RUNTIME_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "proxy-runtime") }}:8080/api'
  WA_LONG_CONNECTION_PROXY_USERNAME: whatsapp
  WORKFLOW_RUNTIME_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "workflow-runtime") }}:8080/api/workflow-runtime'
  MAILBOX_CLOUDFLARE_MAX_MESSAGES_PER_DOMAIN: "500"
  MAILBOX_OUTLOOK_MAX_MESSAGES_PER_MAILBOX: "100"
  MAILBOX_PG_DSN: ""
  MAILBOX_COORDINATION_REDIS_URL: '{{ tpl .Values.configEnv.PLATFORM_REDIS_URL . }}'
  MAILBOX_RECENT_EMAIL_REDIS_URL: '{{ tpl .Values.configEnv.PLATFORM_REDIS_URL . }}'
  MAILBOX_NATS_URL: '{{ tpl .Values.configEnv.PLATFORM_NATS_URL . }}'
  MAILBOX_EVENT_STREAM_NAME: BYTE_V_FORGE_EVENTS
  MAILBOX_BROWSER_AUTOMATION_ADDR: ""

cloudflareEmail:
  zones:
    - zoneName: example.invalid
      enabled: true
      workerName: cloudflare-email-relay
      catchAllEnabled: true

cloudflareTunnel:
  enabled: false
  hostname: hook.example.invalid

workloads:
  gpt-service:
    image:
      repository: gpt-service
      tag: dev
  gopay-app:
    image:
      repository: gopay-app
      tag: dev
  mailbox:
    image:
      repository: mailbox
      tag: dev
  browser-automation:
    image:
      repository: browser-automation
      tag: dev
  proxy-runtime:
    image:
      repository: proxy-runtime
      tag: dev
  workflow-runtime:
    image:
      repository: workflow-runtime
      tag: dev
  sms-service:
    image:
      repository: sms-service
      tag: dev
    env:
      SMS_PROVIDER_HTTP_PROXY: 'socks5://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "proxy-runtime") }}:10810'
  webui:
    image:
      repository: webui
      tag: dev


secrets:
  stringData:
    POSTGRES_PASSWORD: change-me
    N8N_ENCRYPTION_KEY: change-me-at-least-32-characters
    N8N_RUNNERS_AUTH_TOKEN: change-me-at-least-32-characters
    N8N_API_KEY: ""
    N8N_INSTANCE_OWNER_PASSWORD_HASH: "$2b$10$j6/JtPvAKtGGGMVOTqIQrOaq3b0.fQyK46ZWQdNN4E4e496n5ToYq"
    BROWSER_AUTOMATION_PROXY_REFS_JSON: '{"register":"socks5://proxy.internal:10810","outlook":"socks5://proxy.internal:10810"}'
    MAILBOX_WEBHOOK_TOKEN: change-me

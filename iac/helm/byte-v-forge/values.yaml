global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

configEnv:
  BROWSER_AUTOMATION_APPLY_MIGRATIONS: "true"
  BROWSER_AUTOMATION_RUNTIME: camoufox
  PLATFORM_NATS_URL: 'nats://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "platform-nats") }}:4222'
  PLATFORM_EVENT_STREAM_NAME: BYTE_V_FORGE_EVENTS
  PLATFORM_REDIS_URL: 'redis://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "platform-redis") }}:6379/0'
  N8N_PUBLIC_URL: http://n8n.byte-v-forge.192.168.0.126.nip.io:30080
  GPT_N8N_WEBHOOK_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-webhook") }}:5678/webhook'
  WA_N8N_WEBHOOK_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-webhook") }}:5678/webhook'
  GOPAY_N8N_WEBHOOK_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-webhook") }}:5678/webhook'
  GPT_ACTION_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "gpt-service") }}:8080/api/gpt/actions'
  GOPAY_ACTION_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "gopay-app") }}:8080/api/gopay/actions'
  GOPAY_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "gopay-app") }}:8080/api/gopay'
  WA_ACTION_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "wa-app-service") }}:8080/api/wa/actions'
  WA_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "wa-app-service") }}:8080/api/wa'
  SMS_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "sms-service") }}:8080/api/sms'
  PROXY_RUNTIME_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "proxy-runtime") }}:8080/api/proxy-runtime'
  WA_LONG_CONNECTION_PROXY_USERNAME: whatsapp
  WA_NUMBER_PROBE_PROXY_USERNAME: whatsapp-probe
  WA_REGISTRATION_PROXY_USERNAME: whatsapp-reg
  WA_ACCOUNT_SETTINGS_PROXY_USERNAME: whatsapp-reg
  WA_LOGIN_STATE_CHECK_PROXY_USERNAME: whatsapp-reg
  WORKFLOW_RUNTIME_API_BASE_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "workflow-runtime") }}:8080/api/workflow-runtime'
  MAILBOX_WEBHOOK_HTTP_ADDR: ":8082"
  MAILBOX_DASHBOARD_HTTP_ADDR: ":8080"
  GPT_DASHBOARD_HTTP_ADDR: ":8080"
  SMS_DASHBOARD_HTTP_ADDR: ":8080"
  WA_APP_DASHBOARD_HTTP_ADDR: ":8080"
  WA_APP_DATA_DIR: /var/lib/wa-app
  GOPAY_HTTP_LISTEN_ADDR: ":8080"
  GOPAY_DASHBOARD_STATIC_DIR: /app/dashboard/gopay
  MAILBOX_CLOUDFLARE_MAX_MESSAGES_PER_DOMAIN: "500"
  MAILBOX_OUTLOOK_MAX_MESSAGES_PER_MAILBOX: "100"

traefikStatus:
  enabled: true
  entryPoint: internal
  domainSuffix: byte-v-forge.internal
  traefikServiceName: byte-v-forge-traefik-api
  traefikNamespace: traefik

dashboardRoutes:
  enabled: true
  entryPoint: web
  routes:
    - name: gpt
      component: gpt-service
      portName: http-dashboard
      prefixes:
        - /api/gpt
        - /mf/gpt
      priority: 100
    - name: mailbox
      component: mailbox
      portName: http-dashboard
      prefixes:
        - /api/mailbox
        - /mf/mailbox
      priority: 100
    - name: mailbox-webhook
      component: mailbox
      portName: http-webhook
      entryPoint: webhook
      prefixes:
        - /webhooks/email
      priority: 200
    - name: gopay-app
      component: gopay-app
      portName: http-dashboard
      prefixes:
        - /api/gopay
        - /mf/gopay
      priority: 100
    - name: gopay-otp-webhook
      component: gopay-app
      portName: http-webhook
      entryPoint: webhook
      prefixes:
        - /local
        - /tg
      priority: 200
    - name: gopay-otp-webhook-web
      component: gopay-app
      portName: http-webhook
      entryPoint: web
      prefixes:
        - /local
        - /tg
      priority: 300
    - name: sms
      component: sms-service
      portName: http-dashboard
      prefixes:
        - /api/sms
        - /mf/sms
      priority: 100
    - name: wa-app
      component: wa-app-service
      portName: http-dashboard
      host: wa.byte-v-forge.192.168.0.126.nip.io
      prefixes:
        - /
      priority: 500
    - name: proxy-runtime
      component: proxy-runtime
      portName: http
      prefixes:
        - /api/proxy-runtime
        - /proxy-runtime
      priority: 100
    - name: workflow-runtime
      component: workflow-runtime
      portName: http
      prefixes:
        - /api/workflow-runtime
        - /mf/workflow-runtime
      priority: 100
    - name: n8n-editor
      component: n8n-main
      portName: http
      host: n8n.byte-v-forge.192.168.0.126.nip.io
      prefixes:
        - /
      priority: 300
    - name: n8n-webhook
      component: n8n-webhook
      portName: http
      entryPoint: webhook
      prefixes:
        - /webhook
        - /webhook-test
      priority: 200
    - name: webui
      component: webui
      portName: http
      prefixes:
        - /
      priority: 1

cloudflareEmail:
  zones: []

cloudflareTunnel:
  enabled: false
  hostname: hook.tibo-nice.space
  image:
    repository: docker.m.daocloud.io/cloudflare/cloudflared
    tag: 2026.5.0
  metricsPort: 2000
  resources: {}

n8nWorkflows:
  enabled: true
  import:
    enabled: false
    full: false
    workflowFiles: []
  gptProbeAccount:
    id: UuCRf58ufLoDkhC2
    name: GPT Probe Account
    webhookPath: gpt/probe-account



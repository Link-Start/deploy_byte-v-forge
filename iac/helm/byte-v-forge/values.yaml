postgres:
  enabled: true
  image:
    repository: docker.m.daocloud.io/library/postgres
    tag: 15-alpine
  auth:
    user: byte_v_forge
    database: byte_v_forge
  service:
    port: 5432
  sslMode: disable
  external:
    host: ""
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  resources: {}


workloads:
  n8n-redis:
    enabled: true
    replicas: 1
    image:
      repository: docker.m.daocloud.io/library/redis
      tag: 7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - name: redis
        containerPort: 6379
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: redis
          port: 6379
          targetPort: redis
    probes:
      tcpSocketPort: redis
    resources: {}

  n8n-postgres:
    enabled: true
    replicas: 1
    strategyType: Recreate
    image:
      repository: docker.m.daocloud.io/library/postgres
      tag: 15-alpine
    env:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      PGDATA: /var/lib/postgresql/data/pgdata
    secretEnv:
      - name: POSTGRES_PASSWORD
        key: N8N_POSTGRES_PASSWORD
    ports:
      - name: postgres
        containerPort: 5432
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: postgres
          port: 5432
          targetPort: postgres
    probes:
      tcpSocketPort: postgres
    volumeMounts:
      - name: n8n-postgres-data
        mountPath: /var/lib/postgresql/data
    volumes:
      - name: n8n-postgres-data
        type: persistentVolumeClaim
        create: true
        claimName: '{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-postgres") }}-data'
        accessModes:
          - ReadWriteOnce
        size: 10Gi
    resources: {}

  platform-redis:
    enabled: true
    replicas: 1
    image:
      repository: docker.m.daocloud.io/library/redis
      tag: 7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - name: redis
        containerPort: 6379
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: redis
          port: 6379
          targetPort: redis
    probes:
      tcpSocketPort: redis
    resources: {}

  platform-nats:
    enabled: true
    replicas: 1
    strategyType: Recreate
    image:
      repository: docker.m.daocloud.io/library/nats
      tag: 2.14.1
    args:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
    ports:
      - name: nats
        containerPort: 4222
      - name: monitor
        containerPort: 8222
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: nats
          port: 4222
          targetPort: nats
        - name: monitor
          port: 8222
          targetPort: monitor
    probes:
      httpGet:
        path: /healthz
        port: monitor
    volumeMounts:
      - name: nats-data
        mountPath: /data
    volumes:
      - name: nats-data
        type: persistentVolumeClaim
        create: true
        claimName: '{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "platform-nats") }}-data'
        accessModes:
          - ReadWriteOnce
        size: 10Gi
    resources: {}

  n8n-main:
    enabled: true
    replicas: 1
    image:
      repository: docker.n8n.io/n8nio/n8n
      tag: 2.21.7
    env:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: '{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-postgres") }}'
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_TABLE_PREFIX: n8n_
      EXECUTIONS_MODE: queue
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "true"
      QUEUE_BULL_REDIS_HOST: '{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-redis") }}'
      QUEUE_BULL_REDIS_PORT: "6379"
      N8N_EDITOR_BASE_URL: '{{ .Values.configEnv.N8N_PUBLIC_URL }}'
      WEBHOOK_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-webhook") }}:5678/'
      N8N_PROXY_HOPS: "1"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: byte-v-forge@byte-v-forge.local
      N8N_INSTANCE_OWNER_FIRST_NAME: Byte
      N8N_INSTANCE_OWNER_LAST_NAME: Forge
      GPT_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.GPT_ACTION_API_BASE_URL . }}'
      GOPAY_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.GOPAY_ACTION_API_BASE_URL . }}'
      GOPAY_API_BASE_URL: '{{ tpl .Values.configEnv.GOPAY_API_BASE_URL . }}'
      WA_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.WA_ACTION_API_BASE_URL . }}'
      WA_API_BASE_URL: '{{ tpl .Values.configEnv.WA_API_BASE_URL . }}'
      SMS_API_BASE_URL: '{{ tpl .Values.configEnv.SMS_API_BASE_URL . }}'
      PROXY_RUNTIME_API_BASE_URL: '{{ tpl .Values.configEnv.PROXY_RUNTIME_API_BASE_URL . }}'
      WORKFLOW_RUNTIME_API_BASE_URL: '{{ tpl .Values.configEnv.WORKFLOW_RUNTIME_API_BASE_URL . }}'
    secretEnv:
      - name: DB_POSTGRESDB_PASSWORD
        key: N8N_POSTGRES_PASSWORD
      - name: N8N_ENCRYPTION_KEY
        key: N8N_ENCRYPTION_KEY
      - name: N8N_RUNNERS_AUTH_TOKEN
        key: N8N_RUNNERS_AUTH_TOKEN
      - name: N8N_INSTANCE_OWNER_PASSWORD_HASH
        key: N8N_INSTANCE_OWNER_PASSWORD_HASH
      - name: WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN
        key: WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN
    ports:
      - name: http
        containerPort: 5678
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: http
          port: 5678
          targetPort: http
    probes:
      httpGet:
        path: /healthz
        port: http
    resources: {}

  n8n-worker:
    enabled: true
    replicas: 1
    image:
      repository: docker.n8n.io/n8nio/n8n
      tag: 2.21.7
    args:
      - worker
      - --concurrency=5
    env:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: '{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-postgres") }}'
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_TABLE_PREFIX: n8n_
      EXECUTIONS_MODE: queue
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "true"
      QUEUE_BULL_REDIS_HOST: '{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-redis") }}'
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      WEBHOOK_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-webhook") }}:5678/'
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GPT_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.GPT_ACTION_API_BASE_URL . }}'
      GOPAY_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.GOPAY_ACTION_API_BASE_URL . }}'
      GOPAY_API_BASE_URL: '{{ tpl .Values.configEnv.GOPAY_API_BASE_URL . }}'
      WA_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.WA_ACTION_API_BASE_URL . }}'
      WA_API_BASE_URL: '{{ tpl .Values.configEnv.WA_API_BASE_URL . }}'
      SMS_API_BASE_URL: '{{ tpl .Values.configEnv.SMS_API_BASE_URL . }}'
      PROXY_RUNTIME_API_BASE_URL: '{{ tpl .Values.configEnv.PROXY_RUNTIME_API_BASE_URL . }}'
      WORKFLOW_RUNTIME_API_BASE_URL: '{{ tpl .Values.configEnv.WORKFLOW_RUNTIME_API_BASE_URL . }}'
    secretEnv:
      - name: DB_POSTGRESDB_PASSWORD
        key: N8N_POSTGRES_PASSWORD
      - name: N8N_ENCRYPTION_KEY
        key: N8N_ENCRYPTION_KEY
      - name: N8N_RUNNERS_AUTH_TOKEN
        key: N8N_RUNNERS_AUTH_TOKEN
      - name: WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN
        key: WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN
    ports:
      - name: http
        containerPort: 5678
    probes:
      httpGet:
        path: /healthz
        port: http
    extraContainers:
      - name: task-runner
        image: docker.io/n8nio/runners:2.21.7
        imagePullPolicy: IfNotPresent
        env:
          - name: N8N_RUNNERS_TASK_BROKER_URI
            value: http://127.0.0.1:5679
          - name: N8N_RUNNERS_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ include "byte-v-forge.appSecretName" . }}'
                key: N8N_RUNNERS_AUTH_TOKEN
          - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
            value: "0"
          - name: N8N_RUNNERS_MAX_CONCURRENCY
            value: "5"
          - name: N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT
            value: "5680"
          - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
            value: "false"
          - name: GPT_ACTION_API_BASE_URL
            value: '{{ tpl .Values.configEnv.GPT_ACTION_API_BASE_URL . }}'
          - name: GOPAY_ACTION_API_BASE_URL
            value: '{{ tpl .Values.configEnv.GOPAY_ACTION_API_BASE_URL . }}'
          - name: GOPAY_API_BASE_URL
            value: '{{ tpl .Values.configEnv.GOPAY_API_BASE_URL . }}'
          - name: WA_ACTION_API_BASE_URL
            value: '{{ tpl .Values.configEnv.WA_ACTION_API_BASE_URL . }}'
          - name: WA_API_BASE_URL
            value: '{{ tpl .Values.configEnv.WA_API_BASE_URL . }}'
          - name: SMS_API_BASE_URL
            value: '{{ tpl .Values.configEnv.SMS_API_BASE_URL . }}'
          - name: PROXY_RUNTIME_API_BASE_URL
            value: '{{ tpl .Values.configEnv.PROXY_RUNTIME_API_BASE_URL . }}'
          - name: WORKFLOW_RUNTIME_API_BASE_URL
            value: '{{ tpl .Values.configEnv.WORKFLOW_RUNTIME_API_BASE_URL . }}'
          - name: WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ include "byte-v-forge.appSecretName" . }}'
                key: WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN
        ports:
          - name: runner-health
            containerPort: 5680
        readinessProbe:
          httpGet:
            path: /healthz
            port: runner-health
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: runner-health
          initialDelaySeconds: 20
          periodSeconds: 20
        resources: {}
    resources: {}

  n8n-webhook:
    enabled: true
    replicas: 1
    image:
      repository: docker.n8n.io/n8nio/n8n
      tag: 2.21.7
    args:
      - webhook
    env:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: '{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-postgres") }}'
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_TABLE_PREFIX: n8n_
      EXECUTIONS_MODE: queue
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "true"
      QUEUE_BULL_REDIS_HOST: '{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-redis") }}'
      QUEUE_BULL_REDIS_PORT: "6379"
      WEBHOOK_URL: 'http://{{ include "byte-v-forge.componentFullname" (dict "root" . "component" "n8n-webhook") }}:5678/'
      N8N_PROXY_HOPS: "1"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GPT_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.GPT_ACTION_API_BASE_URL . }}'
      GOPAY_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.GOPAY_ACTION_API_BASE_URL . }}'
      GOPAY_API_BASE_URL: '{{ tpl .Values.configEnv.GOPAY_API_BASE_URL . }}'
      WA_ACTION_API_BASE_URL: '{{ tpl .Values.configEnv.WA_ACTION_API_BASE_URL . }}'
      WA_API_BASE_URL: '{{ tpl .Values.configEnv.WA_API_BASE_URL . }}'
      SMS_API_BASE_URL: '{{ tpl .Values.configEnv.SMS_API_BASE_URL . }}'
      PROXY_RUNTIME_API_BASE_URL: '{{ tpl .Values.configEnv.PROXY_RUNTIME_API_BASE_URL . }}'
      WORKFLOW_RUNTIME_API_BASE_URL: '{{ tpl .Values.configEnv.WORKFLOW_RUNTIME_API_BASE_URL . }}'
    secretEnv:
      - name: DB_POSTGRESDB_PASSWORD
        key: N8N_POSTGRES_PASSWORD
      - name: N8N_ENCRYPTION_KEY
